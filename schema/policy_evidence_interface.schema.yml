# Schema for the configuration files of the Policy evidence interface module.
policy_evidence_interface.settings:
  type: config_object
  label: 'Policy evidence interface settings'
  mapping:
    pdf_file:
      type: string
      label: 'pdf file name'
    pdf_root_path:
      type: string
      label: 'path_to_pdf'
    max_results:
      type: integer
      label: 'Maximum results'
    enabled_content_types:
      type: sequence
      label: 'Enabled content types'
      sequence:
        type: string
        label: 'Content type'