policy_evidence_interface.policy_evidence_interface_settings:
  path: '/admin/config/system/policy-evidence-interface-settings'
  defaults:
    _title: 'Policy evidence interface settings'
    _form: 'Drupal\policy_evidence_interface\Form\PolicyEvidenceInterfaceSettingsForm'
  requirements:
    _permission: 'administer site configuration'

policy_evidence_interface.pdf_reader_state:
  path: '/pdf_reader/state'
  defaults:
    _controller: '\Drupal\policy_evidence_interface\Controller\PdfReaderController::state'
    _title: 'pdf reader state'
  requirements:
    _permission: 'administer site configuration'

policy_evidence_interface.pdf_reader_read:
  path: '/pdf_reader/read'
  defaults:
    _controller: '\Drupal\policy_evidence_interface\Controller\PdfReaderController::read'
    _title: 'pdf reader read'
  requirements:
    _permission: 'Access Content'

policy_evidence_interface.endpoint:
  path: '/_mcp'
  defaults:
    _controller: '\Drupal\policy_evidence_interface\Controller\McpServerController::handle'
    _title: 'MCP Server'
  requirements:
    _permission: 'access mcp server'
  methods: [GET, POST, OPTIONS]
  options:
    no_cache: TRUE
    _auth: ['oauth2'] # Enables Simple OAuth authentication middleware
    
# Standard RFC 9728 Protected Resource Metadata Endpoint
policy_evidence_interface.resource_metadata_base:
  path: '/.well-known/oauth-protected-resource'
  defaults:
    _controller: '\Drupal\policy_evidence_interface\Controller\McpServerController::getResourceMetadata'
  requirements:
    _permission: 'access mcp server'

# Protected Resource Metadata Endpoint (RFC 9728 for MCP)
policy_evidence_interface.resource_metadata:
  path: '/.well-known/oauth-protected-resource/_mcp'
  defaults:
    _controller: '\Drupal\policy_evidence_interface\Controller\McpServerController::getResourceMetadata'
  requirements:
    #_permission: 'access mcp server'
    _permission: 'access mcp server'

# OAuth Server Metadata Endpoint
policy_evidence_interface.auth_metadata:
  path: '/.well-known/oauth-authorization-server'
  defaults:
    _controller: '\Drupal\policy_evidence_interface\Controller\McpServerController::getAuthMetadata'
  requirements:
    _permission: 'access mcp server'